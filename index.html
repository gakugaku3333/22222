<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>カタカナクイズ - 楽しく学ぼう！</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Arial', 'Hiragino Kaku Gothic Pro', 'Meiryo', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            touch-action: manipulation;
        }

        .container {
            background: white;
            border-radius: 30px;
            padding: 40px;
            max-width: 800px;
            width: 90%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            text-align: center;
        }

        h1 {
            color: #ff6b9d;
            font-size: 48px;
            margin-bottom: 20px;
            text-shadow: 3px 3px 6px rgba(255, 107, 157, 0.3);
        }

        .score-board {
            display: flex;
            justify-content: space-around;
            margin-bottom: 30px;
            font-size: 24px;
            font-weight: bold;
        }

        .score-item {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            padding: 15px 30px;
            border-radius: 20px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .token-display {
            background: linear-gradient(135deg, #ffd700 0%, #ffed4e 100%);
            color: #333;
            padding: 15px 30px;
            border-radius: 20px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            font-size: 28px;
            font-weight: bold;
            animation: tokenPulse 2s ease-in-out infinite;
        }

        @keyframes tokenPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .shop-btn {
            background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%);
            color: #333;
            padding: 12px 25px;
            border: none;
            border-radius: 15px;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 15px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            transition: all 0.3s ease;
        }

        .shop-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
        }

        .shop-screen {
            max-height: 80vh;
            overflow-y: auto;
        }

        .shop-items {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin: 30px 0;
        }

        .shop-item {
            background: linear-gradient(135deg, #ffecd2 0%, #fcb69f 100%);
            padding: 20px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease;
        }

        .shop-item:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
        }

        .shop-item.owned {
            background: linear-gradient(135deg, #84fab0 0%, #8fd3f4 100%);
            opacity: 0.7;
        }

        .shop-item-icon {
            font-size: 60px;
            margin: 10px 0;
        }

        .shop-item-name {
            font-size: 18px;
            font-weight: bold;
            margin: 10px 0;
            color: #333;
        }

        .shop-item-price {
            font-size: 20px;
            color: #ff6b9d;
            font-weight: bold;
            margin: 10px 0;
        }

        .buy-btn {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .buy-btn:hover {
            transform: scale(1.05);
        }

        .buy-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        .stats-panel {
            background: linear-gradient(135deg, #e0c3fc 0%, #8ec5fc 100%);
            padding: 20px;
            border-radius: 20px;
            margin: 20px 0;
        }

        .stat-item {
            font-size: 20px;
            margin: 10px 0;
            color: #333;
        }

        .back-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 15px;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            margin: 10px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .reward-popup {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            padding: 40px;
            border-radius: 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            z-index: 1000;
            text-align: center;
            animation: popupAppear 0.5s ease;
        }

        @keyframes popupAppear {
            from {
                transform: translate(-50%, -50%) scale(0);
            }
            to {
                transform: translate(-50%, -50%) scale(1);
            }
        }

        .reward-icon-large {
            font-size: 100px;
            margin: 20px 0;
        }

        .katakana-display {
            font-size: 180px;
            font-weight: bold;
            color: #667eea;
            margin: 40px 0;
            text-shadow: 5px 5px 10px rgba(102, 126, 234, 0.3);
            animation: bounce 0.5s ease;
        }

        @keyframes bounce {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        .question {
            font-size: 32px;
            color: #333;
            margin-bottom: 30px;
            font-weight: bold;
        }

        .choices {
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-bottom: 30px;
        }

        .choice-btn {
            font-size: 36px;
            padding: 25px;
            border: none;
            border-radius: 20px;
            background: linear-gradient(135deg, #ffecd2 0%, #fcb69f 100%);
            color: #333;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
            touch-action: manipulation;
            user-select: none;
        }

        .choice-btn:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.25);
        }

        .choice-btn:active {
            transform: translateY(-2px);
        }

        .choice-btn.correct {
            background: linear-gradient(135deg, #84fab0 0%, #8fd3f4 100%);
            animation: correctAnimation 0.6s ease;
        }

        .choice-btn.wrong {
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%);
            animation: shake 0.5s ease;
        }

        @keyframes correctAnimation {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }

        .feedback {
            font-size: 48px;
            font-weight: bold;
            margin: 20px 0;
            min-height: 60px;
        }

        .feedback.correct {
            color: #10b981;
            animation: celebrate 0.5s ease;
        }

        .feedback.wrong {
            color: #ef4444;
        }

        @keyframes celebrate {
            0%, 100% { transform: rotate(0deg); }
            25% { transform: rotate(-10deg); }
            75% { transform: rotate(10deg); }
        }

        .confetti {
            position: fixed;
            width: 10px;
            height: 10px;
            background-color: #f0f;
            position: absolute;
            animation: confetti-fall 3s linear forwards;
        }

        @keyframes confetti-fall {
            to {
                transform: translateY(100vh) rotate(360deg);
                opacity: 0;
            }
        }

        .start-screen {
            text-align: center;
        }

        .start-btn {
            font-size: 42px;
            padding: 30px 60px;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            transition: all 0.3s ease;
        }

        .start-btn:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.4);
        }

        .start-btn:active {
            transform: translateY(-2px);
        }

        .intro-text {
            font-size: 28px;
            color: #555;
            margin: 20px 0;
            line-height: 1.6;
        }

        .hidden {
            display: none;
        }

        .emoji {
            font-size: 80px;
            margin: 20px 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- スタート画面 -->
        <div id="startScreen" class="start-screen">
            <h1>✨ カタカナクイズ ✨</h1>
            <div class="emoji">🌸🎀🌈</div>

            <div class="token-display" style="margin: 20px auto; max-width: 300px;">
                ⭐ <span id="totalTokens">0</span> トークン
            </div>

            <p class="intro-text">
                カタカナをよんでみよう！<br>
                ただしいこたえをえらんでね 💕<br>
                <small style="font-size: 18px;">せいかいすると⭐トークンがもらえるよ！</small>
            </p>
            <button class="start-btn" onclick="startGame()">スタート！</button>
            <button class="shop-btn" onclick="showShop()">🛍️ ショップ</button>
            <button class="shop-btn" onclick="showStats()">📊 とうけい</button>
        </div>

        <!-- ゲーム画面 -->
        <div id="gameScreen" class="hidden">
            <h1>✨ カタカナクイズ ✨</h1>

            <div class="score-board">
                <div class="score-item">
                    スコア: <span id="score">0</span>
                </div>
                <div class="token-display">
                    ⭐ <span id="gameTokens">0</span>
                </div>
                <div class="score-item">
                    もんだい: <span id="questionNum">1</span>/10
                </div>
            </div>

            <div class="katakana-display" id="katakanaDisplay"></div>

            <div class="question">これはなんてよむ？</div>

            <div class="choices" id="choices"></div>

            <div class="feedback" id="feedback"></div>
        </div>

        <!-- 結果画面 -->
        <div id="resultScreen" class="hidden">
            <h1>🎉 おつかれさま！ 🎉</h1>
            <div class="emoji" id="resultEmoji"></div>
            <div style="font-size: 48px; margin: 30px 0; font-weight: bold; color: #667eea;">
                スコア: <span id="finalScore"></span>
            </div>
            <div style="font-size: 36px; margin: 20px 0; font-weight: bold; color: #ffd700;">
                ⭐ <span id="earnedTokens"></span> トークンゲット！
            </div>
            <div id="resultMessage" style="font-size: 32px; color: #555; margin: 20px 0;"></div>
            <button class="start-btn" onclick="location.reload()">もういちど！</button>
        </div>

        <!-- ショップ画面 -->
        <div id="shopScreen" class="hidden shop-screen">
            <h1>🛍️ トークンショップ</h1>

            <div class="token-display" style="margin: 20px auto; max-width: 300px;">
                ⭐ <span id="shopTokens">0</span> トークン
            </div>

            <div class="shop-items" id="shopItems"></div>

            <button class="back-btn" onclick="backToStart()">もどる</button>
        </div>

        <!-- 統計画面 -->
        <div id="statsScreen" class="hidden">
            <h1>📊 がくしゅうきろく</h1>

            <div class="stats-panel">
                <div class="stat-item">🎯 ごうけいせいかい: <span id="totalCorrect">0</span>もん</div>
                <div class="stat-item">📝 ごうけいかいとう: <span id="totalAnswered">0</span>もん</div>
                <div class="stat-item">⭐ ごうけいトークン: <span id="statsTokens">0</span></div>
                <div class="stat-item">🏆 せいかいりつ: <span id="accuracy">0</span>%</div>
            </div>

            <h2 style="color: #667eea; margin: 30px 0 20px;">もっているアイテム</h2>
            <div class="shop-items" id="ownedItems"></div>

            <button class="back-btn" onclick="backToStart()">もどる</button>
        </div>
    </div>

    <script>
        // カタカナと読み方のデータ
        const katakanaData = [
            { katakana: 'ア', hiragana: 'あ' },
            { katakana: 'イ', hiragana: 'い' },
            { katakana: 'ウ', hiragana: 'う' },
            { katakana: 'エ', hiragana: 'え' },
            { katakana: 'オ', hiragana: 'お' },
            { katakana: 'カ', hiragana: 'か' },
            { katakana: 'キ', hiragana: 'き' },
            { katakana: 'ク', hiragana: 'く' },
            { katakana: 'ケ', hiragana: 'け' },
            { katakana: 'コ', hiragana: 'こ' },
            { katakana: 'サ', hiragana: 'さ' },
            { katakana: 'シ', hiragana: 'し' },
            { katakana: 'ス', hiragana: 'す' },
            { katakana: 'セ', hiragana: 'せ' },
            { katakana: 'ソ', hiragana: 'そ' },
            { katakana: 'タ', hiragana: 'た' },
            { katakana: 'チ', hiragana: 'ち' },
            { katakana: 'ツ', hiragana: 'つ' },
            { katakana: 'テ', hiragana: 'て' },
            { katakana: 'ト', hiragana: 'と' },
            { katakana: 'ナ', hiragana: 'な' },
            { katakana: 'ニ', hiragana: 'に' },
            { katakana: 'ヌ', hiragana: 'ぬ' },
            { katakana: 'ネ', hiragana: 'ね' },
            { katakana: 'ノ', hiragana: 'の' },
            { katakana: 'ハ', hiragana: 'は' },
            { katakana: 'ヒ', hiragana: 'ひ' },
            { katakana: 'フ', hiragana: 'ふ' },
            { katakana: 'ヘ', hiragana: 'へ' },
            { katakana: 'ホ', hiragana: 'ほ' },
            { katakana: 'マ', hiragana: 'ま' },
            { katakana: 'ミ', hiragana: 'み' },
            { katakana: 'ム', hiragana: 'む' },
            { katakana: 'メ', hiragana: 'め' },
            { katakana: 'モ', hiragana: 'も' },
            { katakana: 'ヤ', hiragana: 'や' },
            { katakana: 'ユ', hiragana: 'ゆ' },
            { katakana: 'ヨ', hiragana: 'よ' },
            { katakana: 'ラ', hiragana: 'ら' },
            { katakana: 'リ', hiragana: 'り' },
            { katakana: 'ル', hiragana: 'る' },
            { katakana: 'レ', hiragana: 'れ' },
            { katakana: 'ロ', hiragana: 'ろ' },
            { katakana: 'ワ', hiragana: 'わ' },
            { katakana: 'ヲ', hiragana: 'を' },
            { katakana: 'ン', hiragana: 'ん' }
        ];

        let score = 0;
        let currentQuestion = 0;
        let totalQuestions = 10;
        let currentAnswer = '';
        let usedQuestions = [];
        let tokensEarned = 0;

        // ゲームデータの保存・読み込み
        const STORAGE_KEY = 'katakana_game_data';

        const shopItems = [
            { id: 'badge_gold', name: 'きんのバッジ', icon: '🥇', price: 30, type: 'badge' },
            { id: 'badge_silver', name: 'ぎんのバッジ', icon: '🥈', price: 20, type: 'badge' },
            { id: 'badge_bronze', name: 'どうのバッジ', icon: '🥉', price: 10, type: 'badge' },
            { id: 'avatar_cat', name: 'ねこアバター', icon: '🐱', price: 15, type: 'avatar' },
            { id: 'avatar_rabbit', name: 'うさぎアバター', icon: '🐰', price: 15, type: 'avatar' },
            { id: 'avatar_bear', name: 'くまアバター', icon: '🐻', price: 15, type: 'avatar' },
            { id: 'avatar_unicorn', name: 'ゆにこーん', icon: '🦄', price: 25, type: 'avatar' },
            { id: 'effect_rainbow', name: 'にじエフェクト', icon: '🌈', price: 20, type: 'effect' },
            { id: 'effect_sparkle', name: 'きらきら', icon: '✨', price: 20, type: 'effect' },
            { id: 'effect_heart', name: 'はーと', icon: '💕', price: 15, type: 'effect' },
            { id: 'crown', name: 'おうかん', icon: '👑', price: 50, type: 'special' },
            { id: 'trophy', name: 'トロフィー', icon: '🏆', price: 40, type: 'special' }
        ];

        // ゲームデータの初期化
        function loadGameData() {
            const savedData = localStorage.getItem(STORAGE_KEY);
            if (savedData) {
                return JSON.parse(savedData);
            }
            return {
                tokens: 0,
                totalCorrect: 0,
                totalAnswered: 0,
                ownedItems: []
            };
        }

        function saveGameData(data) {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
        }

        let gameData = loadGameData();

        // 初期化時にトークン表示を更新
        function updateTokenDisplay() {
            document.getElementById('totalTokens').textContent = gameData.tokens;
            if (document.getElementById('gameTokens')) {
                document.getElementById('gameTokens').textContent = gameData.tokens;
            }
            if (document.getElementById('shopTokens')) {
                document.getElementById('shopTokens').textContent = gameData.tokens;
            }
            if (document.getElementById('statsTokens')) {
                document.getElementById('statsTokens').textContent = gameData.tokens;
            }
        }

        // ページ読み込み時にトークン表示を更新
        window.addEventListener('DOMContentLoaded', updateTokenDisplay);

        function startGame() {
            document.getElementById('startScreen').classList.add('hidden');
            document.getElementById('gameScreen').classList.remove('hidden');
            score = 0;
            currentQuestion = 0;
            usedQuestions = [];
            tokensEarned = 0;
            updateTokenDisplay();
            nextQuestion();
        }

        function nextQuestion() {
            if (currentQuestion >= totalQuestions) {
                showResult();
                return;
            }

            currentQuestion++;
            document.getElementById('questionNum').textContent = currentQuestion;
            document.getElementById('feedback').textContent = '';
            document.getElementById('feedback').className = 'feedback';

            // ランダムな問題を選択（重複なし）
            let questionData;
            do {
                questionData = katakanaData[Math.floor(Math.random() * katakanaData.length)];
            } while (usedQuestions.includes(questionData.katakana));

            usedQuestions.push(questionData.katakana);
            currentAnswer = questionData.hiragana;

            // カタカナを表示
            const katakanaDisplay = document.getElementById('katakanaDisplay');
            katakanaDisplay.textContent = questionData.katakana;
            katakanaDisplay.style.animation = 'none';
            setTimeout(() => {
                katakanaDisplay.style.animation = 'bounce 0.5s ease';
            }, 10);

            // 選択肢を作成
            const choices = createChoices(questionData.hiragana);
            const choicesContainer = document.getElementById('choices');
            choicesContainer.innerHTML = '';

            choices.forEach(choice => {
                const button = document.createElement('button');
                button.className = 'choice-btn';
                button.textContent = choice;
                button.onclick = () => checkAnswer(choice, button);
                choicesContainer.appendChild(button);
            });
        }

        function createChoices(correctAnswer) {
            const choices = [correctAnswer];
            const allHiragana = katakanaData.map(item => item.hiragana);

            while (choices.length < 3) {
                const randomChoice = allHiragana[Math.floor(Math.random() * allHiragana.length)];
                if (!choices.includes(randomChoice)) {
                    choices.push(randomChoice);
                }
            }

            // シャッフル
            return choices.sort(() => Math.random() - 0.5);
        }

        function checkAnswer(selected, button) {
            const allButtons = document.querySelectorAll('.choice-btn');
            allButtons.forEach(btn => btn.disabled = true);

            const feedback = document.getElementById('feedback');

            // 統計を更新
            gameData.totalAnswered++;

            if (selected === currentAnswer) {
                button.classList.add('correct');
                feedback.textContent = '🎉 せいかい！すごい！';
                feedback.className = 'feedback correct';
                score += 10;
                document.getElementById('score').textContent = score;

                // トークン獲得（正解ごとに2トークン）
                const earnedTokens = 2;
                tokensEarned += earnedTokens;
                gameData.tokens += earnedTokens;
                gameData.totalCorrect++;
                updateTokenDisplay();
                saveGameData(gameData);

                createConfetti();
                playSound('correct');
            } else {
                button.classList.add('wrong');
                feedback.textContent = '😢 ざんねん！こたえは「' + currentAnswer + '」だよ';
                feedback.className = 'feedback wrong';
                playSound('wrong');
            }

            saveGameData(gameData);

            setTimeout(() => {
                allButtons.forEach(btn => {
                    btn.disabled = false;
                    btn.classList.remove('correct', 'wrong');
                });
                nextQuestion();
            }, 2500);
        }

        function createConfetti() {
            const colors = ['#ff6b9d', '#c44569', '#f8b500', '#4bcffa', '#0fbcf9', '#7bed9f', '#ffa502'];

            for (let i = 0; i < 30; i++) {
                setTimeout(() => {
                    const confetti = document.createElement('div');
                    confetti.className = 'confetti';
                    confetti.style.left = Math.random() * 100 + '%';
                    confetti.style.top = '-10px';
                    confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                    confetti.style.width = Math.random() * 10 + 5 + 'px';
                    confetti.style.height = confetti.style.width;
                    document.body.appendChild(confetti);

                    setTimeout(() => confetti.remove(), 3000);
                }, i * 50);
            }
        }

        function playSound(type) {
            // Web Audio APIで簡単な効果音を生成
            const audioContext = new (window.AudioContext || window.webkitAudioContext)();
            const oscillator = audioContext.createOscillator();
            const gainNode = audioContext.createGain();

            oscillator.connect(gainNode);
            gainNode.connect(audioContext.destination);

            if (type === 'correct') {
                oscillator.frequency.setValueAtTime(523.25, audioContext.currentTime); // C5
                oscillator.frequency.setValueAtTime(659.25, audioContext.currentTime + 0.1); // E5
                oscillator.frequency.setValueAtTime(783.99, audioContext.currentTime + 0.2); // G5
            } else {
                oscillator.frequency.setValueAtTime(200, audioContext.currentTime);
            }

            gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.3);

            oscillator.start(audioContext.currentTime);
            oscillator.stop(audioContext.currentTime + 0.3);
        }

        function showResult() {
            document.getElementById('gameScreen').classList.add('hidden');
            document.getElementById('resultScreen').classList.remove('hidden');
            document.getElementById('finalScore').textContent = score + ' / ' + (totalQuestions * 10);
            document.getElementById('earnedTokens').textContent = tokensEarned;

            const resultEmoji = document.getElementById('resultEmoji');
            const resultMessage = document.getElementById('resultMessage');

            if (score >= 90) {
                resultEmoji.textContent = '🏆👑✨';
                resultMessage.textContent = 'かんぺき！！とってもすごい！';
                createConfetti();
            } else if (score >= 70) {
                resultEmoji.textContent = '🌟😊💕';
                resultMessage.textContent = 'とってもよくできました！';
            } else if (score >= 50) {
                resultEmoji.textContent = '🌈😄';
                resultMessage.textContent = 'よくがんばったね！';
            } else {
                resultEmoji.textContent = '💪😊';
                resultMessage.textContent = 'もういちどちょうせんしてみよう！';
            }
        }

        // ショップ画面を表示
        function showShop() {
            hideAllScreens();
            document.getElementById('shopScreen').classList.remove('hidden');
            updateTokenDisplay();
            renderShopItems();
        }

        // 統計画面を表示
        function showStats() {
            hideAllScreens();
            document.getElementById('statsScreen').classList.remove('hidden');
            updateTokenDisplay();
            updateStats();
        }

        // スタート画面に戻る
        function backToStart() {
            hideAllScreens();
            document.getElementById('startScreen').classList.remove('hidden');
            updateTokenDisplay();
        }

        // すべての画面を非表示
        function hideAllScreens() {
            document.getElementById('startScreen').classList.add('hidden');
            document.getElementById('gameScreen').classList.add('hidden');
            document.getElementById('resultScreen').classList.add('hidden');
            document.getElementById('shopScreen').classList.add('hidden');
            document.getElementById('statsScreen').classList.add('hidden');
        }

        // ショップアイテムを描画
        function renderShopItems() {
            const container = document.getElementById('shopItems');
            container.innerHTML = '';

            shopItems.forEach(item => {
                const isOwned = gameData.ownedItems.includes(item.id);
                const itemDiv = document.createElement('div');
                itemDiv.className = 'shop-item' + (isOwned ? ' owned' : '');

                itemDiv.innerHTML = `
                    <div class="shop-item-icon">${item.icon}</div>
                    <div class="shop-item-name">${item.name}</div>
                    <div class="shop-item-price">⭐ ${item.price}</div>
                    ${isOwned ?
                        '<button class="buy-btn" disabled>かいずみ</button>' :
                        `<button class="buy-btn" onclick="buyItem('${item.id}')" ${gameData.tokens < item.price ? 'disabled' : ''}>かう</button>`
                    }
                `;

                container.appendChild(itemDiv);
            });
        }

        // アイテムを購入
        function buyItem(itemId) {
            const item = shopItems.find(i => i.id === itemId);
            if (!item) return;

            if (gameData.tokens >= item.price && !gameData.ownedItems.includes(itemId)) {
                gameData.tokens -= item.price;
                gameData.ownedItems.push(itemId);
                saveGameData(gameData);
                updateTokenDisplay();

                // 購入成功のフィードバック
                showPurchasePopup(item);

                setTimeout(() => {
                    renderShopItems();
                }, 1500);
            }
        }

        // 購入ポップアップを表示
        function showPurchasePopup(item) {
            const popup = document.createElement('div');
            popup.className = 'reward-popup';
            popup.innerHTML = `
                <h2 style="color: #f5576c; margin-bottom: 20px;">🎉 ゲット！</h2>
                <div class="reward-icon-large">${item.icon}</div>
                <div style="font-size: 28px; font-weight: bold; color: #333;">${item.name}</div>
            `;

            document.body.appendChild(popup);
            createConfetti();
            playSound('correct');

            setTimeout(() => {
                popup.remove();
            }, 1500);
        }

        // 統計を更新
        function updateStats() {
            document.getElementById('totalCorrect').textContent = gameData.totalCorrect;
            document.getElementById('totalAnswered').textContent = gameData.totalAnswered;
            document.getElementById('statsTokens').textContent = gameData.tokens;

            const accuracy = gameData.totalAnswered > 0
                ? Math.round((gameData.totalCorrect / gameData.totalAnswered) * 100)
                : 0;
            document.getElementById('accuracy').textContent = accuracy;

            // 所有アイテムを表示
            const ownedContainer = document.getElementById('ownedItems');
            ownedContainer.innerHTML = '';

            if (gameData.ownedItems.length === 0) {
                ownedContainer.innerHTML = '<p style="text-align: center; color: #999; padding: 40px;">まだアイテムをもっていません</p>';
            } else {
                gameData.ownedItems.forEach(itemId => {
                    const item = shopItems.find(i => i.id === itemId);
                    if (item) {
                        const itemDiv = document.createElement('div');
                        itemDiv.className = 'shop-item owned';
                        itemDiv.innerHTML = `
                            <div class="shop-item-icon">${item.icon}</div>
                            <div class="shop-item-name">${item.name}</div>
                        `;
                        ownedContainer.appendChild(itemDiv);
                    }
                });
            }
        }
    </script>
</body>
</html>
